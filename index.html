<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
}

/* Tela principal */
#jumpscare {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: shake 0.06s infinite;
}

/* Rosto */
#face {
    width: 300px;
    height: 400px;
    background: white;
    border-radius: 50% / 60%;
    position: relative;
    opacity: 0;
    animation: fadeIn 0.5s forwards;
    box-shadow: 0 0 60px white;
}

/* Olhos */
.eye {
    width: 50px;
    height: 70px;
    background: black;
    position: absolute;
    top: 140px;
    border-radius: 50%;
}

.eye.left { left: 65px; }
.eye.right { right: 65px; }

/* Tremor */
@keyframes shake {
    0% { transform: translate(10px, -10px); }
    25% { transform: translate(-10px, 10px); }
    50% { transform: translate(10px, 10px); }
    75% { transform: translate(-10px, -10px); }
    100% { transform: translate(10px, -10px); }
}

/* Aparição */
@keyframes fadeIn {
    to { opacity: 1; }
}

/* Glitch piscando */
.glitch {
    animation: flicker 0.15s infinite;
}

@keyframes flicker {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}

/* Acessibilidade: Reduzir movimento */
@media (prefers-reduced-motion: reduce) {
    #jumpscare {
        animation: none;
    }
    .glitch {
        animation: none;
    }
    #face {
        opacity: 1;
        animation: none;
    }
}
</style>
</head>

<body>

<div id="jumpscare" role="img" aria-label="Animação de rosto assustador com olhos">
    <div id="face" class="glitch">
        <div class="eye left"></div>
        <div class="eye right"></div>
    </div>
</div>

</body>
</html>
